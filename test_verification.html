<!DOCTYPE html>
<html>
<head>
    <title>Verification Test</title>
</head>
<body>
    <div id="result">Running...</div>
    <script src="./js/economy.js"></script>
    <script>
        try {
            if (typeof Economy.load === 'function') {
                Economy.load();
                document.getElementById('result').textContent = 'SUCCESS: Economy.load exists and executed without error.';
            } else {
                document.getElementById('result').textContent = 'FAILURE: Economy.load is not a function.';
            }
        } catch (e) {
            document.getElementById('result').textContent = 'ERROR: ' + e.message;
        }
    </script>
</body>
</html>
