<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self';">

  <!-- SEO Básico -->
  <title>PsyCase - Casos Clínicos de Psiquiatría para Estudiantes de Medicina y ENARM</title>
  <meta name="description" content="PsyCase es un simulador interactivo de casos clínicos de psiquiatría diseñado para estudiantes de medicina, residentes y preparación ENARM/MIR. Mejora tu diagnóstico clínico bajo presión.">
  <meta name="keywords" content="casos clínicos, psiquiatría, simulador médico, estudiantes de medicina, ENARM, MIR, DSM-5, diagnóstico psiquiátrico, app médica">
  <meta name="author" content="PsyCase">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://psycase.app/">
  <meta property="og:title" content="PsyCase - Casos Clínicos de Psiquiatría">
  <meta property="og:description" content="Simulador de casos clínicos interactivos de psiquiatría para estudiantes de medicina y ENARM.">
  <meta property="og:image" content="./assets/icons/icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:url" content="https://psycase.app/">
  <meta property="twitter:title" content="PsyCase - Casos Clínicos de Psiquiatría">
  <meta property="twitter:description" content="Aprende psiquiatría con casos clínicos interactivos para estudiantes de medicina y ENARM.">
  <meta property="twitter:image" content="./assets/icons/icon-512.png">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#050510">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <!-- Performance para fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Estética Miami Vice / Synthwave -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <div class="scanline" aria-hidden="true"></div>
  <div class="urgency-fx" aria-hidden="true"></div>

  <main id="app">
    <!-- Raíces separadas: evita que UI borre el HUD por accidente -->
    <h1 class="sr-only">PsyCase · simulador de guardia psiquiátrica</h1>
    <div id="hudRoot"></div>
    <div id="caseRoot">
      <div class="miami-card" style="text-align:center;">
        <div class="spinner"></div>
        <div style="text-align:center; opacity:.8; font-weight:700;">Cargando PsyCase…</div>
      </div>
    </div>
    <div id="modalRoot"></div>
    <div id="fxRoot" aria-live="polite"></div>
  </main>

  <div id="debug" aria-hidden="true"></div>


  <!-- Orden de carga: boot (utilidades + SW) → economía → banco de casos → generador → juego -->
  <script src="./js/boot.js"></script>
  <script src="./js/economy.js"></script>
  <script src="./js/caseLoader.js"></script>
  <script src="./js/generator.js"></script>
  <script src="./js/game.js"></script>

</body>
</html>
