<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self';">

  <!-- SEO Básico -->
  <title>PsyCase - Casos Clínicos de Psiquiatría para Estudiantes de Medicina y ENARM</title>
  <meta name="description" content="PsyCase es un simulador interactivo de casos clínicos de psiquiatría diseñado para estudiantes de medicina, residentes y preparación ENARM/MIR. Mejora tu diagnóstico clínico bajo presión.">
  <meta name="keywords" content="casos clínicos, psiquiatría, simulador médico, estudiantes de medicina, ENARM, MIR, DSM-5, diagnóstico psiquiátrico, app médica">
  <meta name="author" content="PsyCase">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://psycase.app/">
  <meta property="og:title" content="PsyCase - Casos Clínicos de Psiquiatría">
  <meta property="og:description" content="Simulador de casos clínicos interactivos de psiquiatría para estudiantes de medicina y ENARM.">
  <meta property="og:image" content="./assets/icons/icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:url" content="https://psycase.app/">
  <meta property="twitter:title" content="PsyCase - Casos Clínicos de Psiquiatría">
  <meta property="twitter:description" content="Aprende psiquiatría con casos clínicos interactivos para estudiantes de medicina y ENARM.">
  <meta property="twitter:image" content="./assets/icons/icon-512.png">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#050510">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <!-- Performance para fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Estética Miami Vice / Synthwave -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <div class="scanline" aria-hidden="true"></div>

  <div id="app">
    <!-- Raíces separadas: evita que UI borre el HUD por accidente -->
    <div id="hudRoot"></div>
    <div id="caseRoot">
      <div class="miami-card" style="text-align:center;">
        <div class="spinner"></div>
        <div style="text-align:center; opacity:.8; font-weight:700;">Cargando PsyCase…</div>
      </div>
    </div>
    <div id="modalRoot"></div>
  </div>

  <div id="debug"></div>

  <script>
    function _esc(s) {
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    // Debug toggle: tecla D (solo en localhost)
    const _isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    window.addEventListener("keydown", (e) => {
      if (!_isLocal) return;
      if (e.key.toLowerCase() === "d") {
        const dbg = document.getElementById("debug");
        if (dbg) dbg.style.display = (dbg.style.display === "block" ? "none" : "block");
      }
    });

    function logDebug(msg){
      if (!_isLocal) return;
      const dbg = document.getElementById("debug");
      if (!dbg) return;
      dbg.textContent += (dbg.textContent ? "\n" : "") + msg;
    }

    window.addEventListener("error", (e) => {
      logDebug("[error] " + (e.message || "unknown") + (e.filename ? ` @ ${e.filename}:${e.lineno}` : ""));
      const root = document.getElementById("caseRoot");
      if (root) root.innerHTML = `<div class="miami-card"><div style="font-weight:900;color:#f472b6;">Error</div><div style="opacity:.85;margin-top:8px;">${_esc(e.message || e)}</div></div>`;
    });

    window.addEventListener("unhandledrejection", (e) => {
      logDebug("[promise] " + String(e.reason || "unhandled"));
    });

    // SW: si existe, se registra y se fuerza la actualización inmediata.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
          logDebug("[sw] registered");

          // Forzar la búsqueda de actualizaciones del Service Worker al cargar la página
          reg.update();

          // Si ya hay un SW esperando activación, enviarle SKIP_WAITING
          if (reg.waiting) {
            reg.waiting.postMessage({ type: "SKIP_WAITING" });
          }

          // Escuchar cambios en la instalación
          reg.addEventListener("updatefound", () => {
            const installingWorker = reg.installing;
            if (installingWorker) {
              installingWorker.addEventListener("statechange", () => {
                if (installingWorker.state === "installed") {
                  if (navigator.serviceWorker.controller) {
                    logDebug("[sw] Nueva versión detectada, notificando recarga...");
                    if (installingWorker) {
                      installingWorker.postMessage({ type: "SKIP_WAITING" });
                    }
                  } else {
                    logDebug("[sw] Contenido cacheado para uso offline.");
                  }
                }
              });
            }
          });
        } catch (err) {
          logDebug("[sw] register failed: " + String(err));
        }
      });

      // Recargar automáticamente cuando el nuevo Service Worker toma el control (skipWaiting)
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!refreshing) {
          refreshing = true;
          logDebug("[sw] Controlador activado, aplicando actualización...");
          window.location.reload();
        }
      });
    }
  </script>

  <!-- ORDEN CORRECTO DE CARGA -->
  <script src="./js/economy.js"></script>
  <script src="./js/caseLoader.js"></script>
  <script src="./js/generator.js"></script>
  <script src="./js/game.js"></script>

</body>
</html>
