<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PsyCase: Miami Vice Edition</title>

  <!-- PWA (si no existe manifest, no rompe) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#000000">

  <!-- Performance para fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Estética Miami Vice / Synthwave -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-dark: #000000;
      --miami-cyan: #00f3ff;
      --miami-pink: #ff00ff;
      --miami-purple: #7000ff;
      --glass-bg: rgba(10, 5, 25, 0.98);
      --text-main: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        linear-gradient(rgba(112, 0, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(112, 0, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .hud-font { font-family: 'Chakra Petch', sans-serif; }

    .miami-card {
      background: var(--glass-bg);
      border: 3px solid var(--miami-cyan);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
      border-radius: 32px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .btn-action {
      width: 100%;
      padding: 18px;
      border: 4px solid white;
      border-radius: 40px;
      background: linear-gradient(135deg, var(--miami-pink), var(--miami-purple));
      color: white;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 8px 0px rgba(0, 0, 0, 0.6);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }
    .btn-action:active { transform: translateY(6px); box-shadow: 0 2px 0px rgba(0, 0, 0, 0.6); }

    .option-btn {
      width: 100%;
      padding: 16px;
      background: #0d0a21;
      border: 2px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 24px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .option-btn:hover { border-color: var(--miami-cyan); background: #1a143d; transform: scale(1.02); }
    .option-btn.correct { border-color: #39ff14 !important; background: rgba(57, 255, 20, 0.15) !important; color: #39ff14 !important; }
    .option-btn.incorrect { border-color: #ff0055 !important; background: rgba(255, 0, 85, 0.15) !important; color: #ff0055 !important; }
    .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .patience-track {
      height: 12px;
      background: #111;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    .patience-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--miami-cyan), var(--miami-pink));
      box-shadow: 0 0 15px var(--miami-cyan);
      transition: width 0.1s linear;
    }

    .avatar-glow { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3)); }

    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }

    .scanline {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px; z-index: 1000; pointer-events: none; opacity: 0.3;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--miami-cyan);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Debug panel */
    #debug {
      display:none;
      position:fixed; left:10px; right:10px; bottom:10px;
      background: rgba(0,0,0,.92);
      border: 2px solid rgba(0,243,255,.45);
      border-radius: 18px;
      padding: 12px;
      z-index: 2000;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 35vh;
      overflow:auto;
    }
  </style>
</head>

<body>
  <div class="scanline"></div>

  <div id="app" class="max-w-lg mx-auto p-4 min-h-screen flex flex-col justify-center">
    <!-- Raíces separadas: evita que UI borre el HUD por accidente -->
    <div id="hudRoot"></div>
    <div id="caseRoot" class="miami-card">
      <div class="spinner"></div>
      <div class="text-center opacity-80 font-bold">Cargando PsyCase…</div>
    </div>
    <div id="modalRoot"></div>
  </div>

  <div id="debug"></div>

  <script>
    // Debug toggle: tecla D
    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "d") {
        const dbg = document.getElementById("debug");
        if (dbg) dbg.style.display = (dbg.style.display === "block" ? "none" : "block");
      }
    });

    function logDebug(msg){
      const dbg = document.getElementById("debug");
      if (!dbg) return;
      dbg.textContent += (dbg.textContent ? "\n" : "") + msg;
    }

    window.addEventListener("error", (e) => {
      logDebug("[error] " + (e.message || "unknown") + (e.filename ? ` @ ${e.filename}:${e.lineno}` : ""));
      const root = document.getElementById("caseRoot");
      if (root) root.innerHTML = `<div class="miami-card"><div class="font-black text-pink-400">Error</div><div style="opacity:.85;margin-top:8px;">${String(e.message || e).replaceAll("<","&lt;")}</div></div>`;
    });

    window.addEventListener("unhandledrejection", (e) => {
      logDebug("[promise] " + String(e.reason || "unhandled"));
    });

    // SW: si existe, se registra. Si no, no rompe la demo.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
          logDebug("[sw] registered");
        } catch (err) {
          logDebug("[sw] register failed: " + String(err));
        }
      });
    }
  </script>

  <!-- ORDEN CORRECTO DE CARGA -->
  <script src="./js/economy.js"></script>
  <script src="./js/caseLoader.js"></script>
  <script src="./js/generator.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/game.js"></script>

</body>
</html>
