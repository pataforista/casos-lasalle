<!DOCTYPE html>
<html>
<head>
  <title>Test Sprites</title>
  <style>
    body {
      background: #120e2e;
      color: #fff;
      font-family: monospace;
      padding: 20px;
    }
    .sprite-container {
      margin-bottom: 40px;
      border: 2px solid #555;
      padding: 10px;
      background: #1a153a;
    }
    .sprite-img {
      position: relative;
      display: inline-block;
    }
    img {
      display: block;
      border: 1px solid red;
    }
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .grid-col-4 {
      background: repeating-linear-gradient(
        to right,
        transparent,
        transparent calc(25% - 1px),
        rgba(0, 255, 255, 0.8) calc(25% - 1px),
        rgba(0, 255, 255, 0.8) 25%
      );
    }
    .grid-col-2x2 {
      background: 
        repeating-linear-gradient(
          to right,
          transparent,
          transparent calc(50% - 1px),
          rgba(255, 0, 255, 0.8) calc(50% - 1px),
          rgba(255, 0, 255, 0.8) 50%
        ),
        repeating-linear-gradient(
          to bottom,
          transparent,
          transparent calc(50% - 1px),
          rgba(255, 0, 255, 0.8) calc(50% - 1px),
          rgba(255, 0, 255, 0.8) 50%
        );
    }
    /* Let's try 3x2, 4x2, etc to see which grid fits best */
    .grid-col-3x2 {
      background: 
        repeating-linear-gradient(
          to right,
          transparent,
          transparent calc(33.333% - 1px),
          rgba(255, 255, 0, 0.8) calc(33.333% - 1px),
          rgba(255, 255, 0, 0.8) 33.333%
        ),
        repeating-linear-gradient(
          to bottom,
          transparent,
          transparent calc(50% - 1px),
          rgba(255, 255, 0, 0.8) calc(50% - 1px),
          rgba(255, 255, 0, 0.8) 50%
        );
    }
  </style>
</head>
<body>
  <h1>Reviewing Sprites</h1>

  <div class="sprite-container">
    <h3>Dr. Castañeda (4128x1024) - expected 4x1</h3>
    <div class="sprite-img">
      <img src="assets/sprites/Dr. Castañeda.png" width="800">
      <div class="grid-overlay grid-col-4"></div>
    </div>
  </div>

  <div class="sprite-container">
    <h3>Dra. Aguilar (2816x1536) - testing 2x2 grid</h3>
    <div class="sprite-img">
      <img src="assets/sprites/Dra. Aguilar.png" width="800">
      <div class="grid-overlay grid-col-2x2"></div>
    </div>
    <h3>testing 3x2 grid</h3>
    <div class="sprite-img">
      <img src="assets/sprites/Dra. Aguilar.png" width="800">
      <div class="grid-overlay grid-col-3x2"></div>
    </div>
  </div>

  <div class="sprite-container">
    <h3>Dr. Mendoza (2752x1536) - testing 2x2 grid</h3>
    <div class="sprite-img">
      <img src="assets/sprites/Dr. Mendoza.png" width="800">
      <div class="grid-overlay grid-col-2x2"></div>
    </div>
  </div>

</body>
</html>
