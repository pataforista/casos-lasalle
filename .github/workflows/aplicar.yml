# Cada push: aplica EDITAR_JUEGO.md, regenera el mapa y, si algo cambió,
# lo guarda en un commit «Aplicar EDITAR_JUEGO.md» en la misma rama.
# Así quien edita el documento desde github.com (incluso en el móvil) no
# necesita instalar nada. Después comprueba que todo quedó coherente.
# Si el documento tiene un error, este paso sale en rojo con la línea exacta
# y no se cambia nada del juego.
name: aplicar y comprobar

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aplicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar EDITAR_JUEGO.md
        run: node tools/editDoc.js apply
      - name: Regenerar el mapa de la app
        run: node tools/buildAppMap.js
      - name: Guardar los cambios generados
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
            git add EDITAR_JUEGO.md js/content.js sw.js data docs/MAPA_APP.md
            git commit -m "Aplicar EDITAR_JUEGO.md"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Comprobar
        run: npm run check
